services:
  app:
    build: .
    env_file: .env
    depends_on: [db]
    restart: unless-stopped
    volumes:
      - ./seeds:/app/seeds:ro
    ports:
      - "127.0.0.1:8080:8080"
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  pgdata:
