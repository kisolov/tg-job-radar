[project]
name = "radar"
version = "0.1.0"
description = "Userbot-радар вакансий и заказов из русскоязычных Telegram-чатов"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "aiogram>=3.20,<4",
    "aiohttp>=3.11",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "dependency-injector>=4.42",
    "httpx>=0.27",
    "cryptography>=43",
    "opentele>=1.15.1",
]

[project.scripts]
radar = "radar.bootstrap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
